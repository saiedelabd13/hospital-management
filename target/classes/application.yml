spring:
  application:
    name: hospital-management


  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_db
    username: mohamed
    password: mohamed
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true



