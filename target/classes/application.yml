app:
  jwt:
    secret: HospitalManagementSystemSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
    expiration: 86400000
    refresh-expiration: 604800000

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.hospital: DEBUG
    org.springframework.security: INFO